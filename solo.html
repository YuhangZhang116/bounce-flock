<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>弹弹追鸡 · 摇头特效版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1430; --line:#0b0817; --panel:#2b2250; --panel2:#382d66;
  --cream:#fff2cf; --dim:#9a8fc4; --yolk:#ffd23f; --hawk:#ff5a3c; --mint:#53e3b7; --pink:#ff8fb3;
  --f:"DotGothic16","Silkscreen","PingFang SC","Microsoft YaHei",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0f0b1f;color:var(--cream);font-family:var(--f)}
body{display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#frame{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);container-type:size;background:var(--ink);box-shadow:0 0 0 4px var(--line)}
#out{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:3cqh;padding:6cqw;box-sizing:border-box;background:rgba(17,12,34,.72)}
.ov.end{background:transparent;justify-content:flex-end;padding-bottom:5cqh}
h1{margin:0;font-weight:400;font-size:14cqw;line-height:1.05;color:var(--yolk);text-shadow:0 .9cqw 0 var(--line),.7cqw 0 0 var(--hawk)}
.sub{font-family:"Silkscreen",monospace;color:var(--mint);font-size:3.2cqw;letter-spacing:.25em;margin-top:1cqh}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.6cqh}
ol li{display:flex;gap:3cqw;align-items:center;font-size:4.2cqw;line-height:1.35;background:var(--line);padding:2cqw 3cqw}
ol b{flex:0 0 auto;width:8cqw;height:8cqw;display:grid;place-items:center;background:var(--c);color:var(--line);font-weight:400}
button{font:inherit;cursor:pointer;color:var(--cream);background:var(--panel2);border:.8cqw solid var(--line);box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.28),0 .8cqw 0 var(--line);padding:2.6cqw 3cqw;font-size:4.6cqw}
button:active{transform:translateY(.8cqw);box-shadow:inset 0 -.5cqw 0 rgba(0,0,0,.28)}
button:focus-visible{outline:.8cqw solid var(--yolk);outline-offset:.6cqw}
button.big{background:var(--yolk);color:var(--line);font-size:6cqw}
button[disabled]{opacity:.5;cursor:wait}
.row{display:flex;gap:3cqw}.row>*{flex:1}
label.rec{display:flex;align-items:center;gap:2cqw;font-size:3.8cqw;color:var(--cream)}
label.rec input{width:5cqw;height:5cqw;accent-color:var(--hawk)}
.note{font-size:3.2cqw;color:var(--dim);line-height:1.5;margin:0}
.err{color:var(--hawk)}
#recBadge{position:absolute;bottom:4.5cqh;right:3cqw;font-family:"Silkscreen",monospace;font-size:3.2cqw;background:var(--hawk);color:var(--line);padding:.6cqw 1.6cqw;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#help{position:absolute;bottom:1.2cqh;left:0;right:0;text-align:center;font-size:2.8cqw;color:var(--dim);pointer-events:none}
@media (prefers-reduced-motion:reduce){#recBadge{animation:none}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="out" aria-label="游戏画面"></canvas>

  <div class="ov" id="menu">
    <div><h1>弹弹追鸡</h1><div class="sub">FACE FX · 30 SEC</div></div>
    <ol>
      <li><b style="--c:var(--yolk)">1</b>转动脑袋，小鸡跟着你跑</li>
      <li><b style="--c:var(--pink)">2</b>张大嘴，小鸡跳起来躲老鹰</li>
      <li><b style="--c:var(--hawk)">3</b>地上出现红圈就快跑，30 秒内吃金蛋</li>
    </ol>
    <button class="big" id="camBtn" type="button">打开摄像头开始</button>
    <div class="row">
      <button id="mouseBtn" type="button">用鼠标试玩</button>
      <label class="rec"><input type="checkbox" id="recChk" checked>录下这一局</label>
    </div>
    <p class="note" id="note">画面只在你这台电脑上识别，不会上传。按 M 可以慢放动效。</p>
  </div>

  <div class="ov end" id="endOv" hidden>
    <div class="row">
      <button class="big" id="againBtn" type="button">再来一局</button>
      <button id="saveBtn" type="button" hidden>保存视频</button>
    </div>
    <button id="homeBtn" type="button">回到开始</button>
  </div>

  <div id="recBadge" hidden>● REC</div>
  <div id="help" hidden>M 慢放 · 空格也能跳</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

/* =====================================================================
   动效规范 MOTION SPEC —— 所有时长/力度集中在这里，方便调参和做拆解页
   ===================================================================== */
const MOTION = {
  hopVelocity:   9.5,   // 张嘴起跳初速度
  gravity:       30,    // 重力：决定滞空约 0.63s
  takeoffStretch:-.55,  // 起跳瞬间拉长
  landSquash:    .55,   // 落地压扁
  squashSpring:  190,   // 形变回弹刚度（越大越快）
  squashDamp:    11,    // 形变阻尼（越小越抖）
  aimTime:       .95,   // 老鹰锁定预警时长（红圈收缩）
  aimTrack:      .55,   // 预警前 55% 时间内红圈会跟随小鸡
  diveTime:      .26,   // 俯冲时长（ease-in 加速）
  riseTime:      .8,    // 回升时长（ease-out）
  hitRadius:     1.35,  // 俯冲命中半径
  nearRadius:    2.4,   // 「好险」判定半径
  hitSlowmo:     .45,   // 被啄中慢动作时长
  slowScale:     .22,   // 慢动作倍率
  hitShake:      .8,    // 被啄中震屏强度
  impactShake:   .28,   // 俯冲落地震屏
  punchFov:      7,     // 被啄中镜头推近（度）
  calloutIn:     .18,   // 大字弹出
  calloutHold:   .55,
  popupRise:     70,    // 加分数字上飘（像素）
  cardIn:        .6,    // 结果卡滑入（ease-out-back）
  scoreCount:    .9,    // 结果分数滚动
};
const GAME = { dur:30, hearts:3, eggPts:10, dodgePts:5, nearPts:3, heartBonus:30, hawkAt:[0, 8, 18] };

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rnd = (a,b) => a + Math.random()*(b-a);
const len = (x,z) => Math.hypot(x,z);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const easeInCubic = t => t*t*t;
const easeOutCubic = t => 1 - Math.pow(1-t, 3);

/* ---------------- output canvas (9:16, composited, recordable) ---------------- */
const OW = 540, OH = 960, SC = 3, LW = OW/SC, LH = OH/SC;
const out = $('#out'); out.width = OW; out.height = OH;
const ctx = out.getContext('2d');

/* ---------------- three.js low-res pixel render ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(1); renderer.setSize(LW, LH, false);
const glc = renderer.domElement;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x140f26);
const camera = new THREE.PerspectiveCamera(55, LW/LH, .1, 100);
const CAM_BASE = new THREE.Vector3(0, 17.5, 11.5);

const HW = 5, HL = 7;
const GRAD = (() => { const t = new THREE.DataTexture(new Uint8Array([70,150,255]), 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (c, x={}) => new THREE.MeshToonMaterial({ color:c, gradientMap:GRAD, ...x });
const OUT = new THREE.MeshBasicMaterial({ color:0x0b0817, side:THREE.BackSide });
scene.add(new THREE.HemisphereLight(0xc9c0ff, 0x2a1d4a, .95));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.6); sun.position.set(-6, 18, 9); scene.add(sun);
function ctex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; }

// floor
const floorTex = ctex(HW*8, HL*8, (g,w,h) => {
  for (let y=0;y<h;y+=4) for (let x=0;x<w;x+=4) { g.fillStyle = ((x+y)/4)%2 ? '#2e2560' : '#352a6e'; g.fillRect(x,y,4,4); }
  g.strokeStyle = '#53e3b7'; g.strokeRect(2.5,2.5,w-5,h-5);
  g.fillStyle = 'rgba(255,210,63,.18)'; g.fillRect(w/2-8, h/2-8, 16, 16);
  g.fillStyle = '#ff8fb3'; for (let i=0;i<5;i++) g.fillRect(w/2-1, 8+i*8, 2, 4);
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HW*2, HL*2), toon(0xffffff, { map:floorTex }));
floor.rotation.x = -Math.PI/2; scene.add(floor);
const under = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshBasicMaterial({ color:0x0f0b1f })); under.rotation.x = -Math.PI/2; under.position.y = -.02; scene.add(under);
const brick = ctex(16, 8, g => { g.fillStyle='#ff8fb3'; g.fillRect(0,0,16,8); g.fillStyle='#d9628f'; g.fillRect(0,3,16,1); g.fillRect(0,7,16,1); g.fillRect(7,0,1,3); g.fillRect(3,4,1,3); g.fillRect(11,4,1,3); });
function wall(w, d, x, z){ const t = brick.clone(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.max(w,d)/1.4, 1); t.needsUpdate = true;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.2, d), toon(0xffffff, { map:t })); m.position.set(x, .6, z); scene.add(m); }
wall(HW*2+2, 1, 0, -HL-.5); wall(HW*2+2, 1, 0, HL+.5); wall(1, HL*2, -HW-.5, 0); wall(1, HL*2, HW+.5, 0);

// bumpers
const BUMPERS = [[-2.6,-2.8],[2.6,-2.8],[0,1.8]].map(([x,z],i) => ({ x, z, r:.85, flash:0, i }));
const BCOL = [0xff8fb3, 0x53e3b7, 0xffd23f];
const bumperMeshes = BUMPERS.map((b,i) => {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(b.r, b.r*1.08, .35, 10), toon(0x2b2250)); base.position.y = .17;
  const capMat = toon(BCOL[i], { emissive:BCOL[i], emissiveIntensity:0 });
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(b.r*.85, b.r*.85, .45, 10), capMat); cap.position.y = .55;
  const o = new THREE.Mesh(cap.geometry, OUT); o.scale.setScalar(1.1); cap.add(o);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(b.r*.4, b.r*.4, .16, 10), toon(0xfff2cf)); top.position.y = .85;
  g.add(base, cap, top); g.position.set(b.x, 0, b.z); scene.add(g);
  return { cap, capMat };
});

// particles
const PMAX = 260;
const pMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.16,.16,.16), new THREE.MeshBasicMaterial({ color:0xffffff }), PMAX);
pMesh.frustumCulled = false; scene.add(pMesh);
const parts = Array.from({length:PMAX}, () => ({ life:0 }));
for (let i=0;i<PMAX;i++) pMesh.setColorAt(i, new THREE.Color(1,1,1));
let pNext = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _c = new THREE.Color();
function burst(x, y, z, n, colors, spd=5, life=.6, grav=14, size=1){
  for (let k=0;k<n;k++) {
    const i = pNext, p = parts[i]; pNext = (pNext+1) % PMAX;
    const a = Math.random()*Math.PI*2, u = .4 + Math.random();
    Object.assign(p, { x, y, z, vx:Math.cos(a)*spd*u, vz:Math.sin(a)*spd*u, vy:rnd(.3,1)*spd, life:life*rnd(.6,1.2), g:grav, s:size*rnd(.7,1.3) });
    p.max = p.life;
    pMesh.setColorAt(i, _c.set(Array.isArray(colors) ? colors[k % colors.length] : colors));
  }
  pMesh.instanceColor.needsUpdate = true;
}
function stepParts(dt){
  for (let i=0;i<PMAX;i++) {
    const p = parts[i];
    if (p.life > 0) {
      p.life -= dt; p.vy -= p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      if (p.y < .08) { p.y = .08; p.vy *= -.4; p.vx *= .7; p.vz *= .7; }
      const s = p.s * Math.max(0, p.life/p.max);
      _m.compose(_p.set(p.x,p.y,p.z), _q, _s.set(s,s,s));
    } else _m.compose(_p.set(0,-50,0), _q, _s.set(0,0,0));
    pMesh.setMatrixAt(i, _m);
  }
  pMesh.instanceMatrix.needsUpdate = true;
}

/* ---------------- face texture (your face on the chick) ---------------- */
const FPX = 24;
const faceC = document.createElement('canvas'); faceC.width = faceC.height = FPX;
const fctx = faceC.getContext('2d', { willReadFrequently:true });
const tmpC = document.createElement('canvas'); tmpC.width = tmpC.height = 96;
const tctx = tmpC.getContext('2d');
const faceTex = new THREE.CanvasTexture(faceC); faceTex.magFilter = faceTex.minFilter = THREE.NearestFilter; faceTex.colorSpace = THREE.SRGBColorSpace;
const snapC = document.createElement('canvas'); snapC.width = snapC.height = FPX; // funniest face (widest mouth)
function circleMaskAndQuantize(){
  const img = fctx.getImageData(0,0,FPX,FPX), d = img.data, c = (FPX-1)/2;
  for (let y=0;y<FPX;y++) for (let x=0;x<FPX;x++) {
    const i = (y*FPX+x)*4, r = Math.hypot(x-c, y-c);
    if (r > c+.4) { d[i+3] = 0; continue; }
    if (r > c-.8) { d[i]=11; d[i+1]=8; d[i+2]=23; d[i+3]=255; continue; }
    for (let k=0;k<3;k++) { let v = d[i+k]/255; v = clamp((v-.5)*1.25+.54, 0, 1); d[i+k] = Math.round(v*5)/5*255; }
    d[i] = Math.min(255, d[i]+10); d[i+3] = 255;
  }
  fctx.putImageData(img, 0, 0);
}
function drawDefaultFace(){
  fctx.clearRect(0,0,FPX,FPX);
  fctx.fillStyle = '#ffd23f'; fctx.beginPath(); fctx.arc(FPX/2, FPX/2, FPX/2, 0, 7); fctx.fill();
  fctx.fillStyle = '#0b0817'; fctx.fillRect(7,9,2,4); fctx.fillRect(15,9,2,4);
  fctx.fillStyle = '#ff9a2e'; fctx.fillRect(10,14,4,2); fctx.fillRect(11,16,2,1);
  fctx.fillStyle = '#ff8fb3'; fctx.fillRect(4,14,3,2); fctx.fillRect(17,14,3,2);
  circleMaskAndQuantize(); faceTex.needsUpdate = true;
  snapC.getContext('2d').clearRect(0,0,FPX,FPX); snapC.getContext('2d').drawImage(faceC, 0, 0);
}
drawDefaultFace();

/* ---------------- chick ---------------- */
function buildChick(){
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const r = .8, sg = new THREE.SphereGeometry(r, 10, 7);
  const bodyMat = toon(0xffd23f);
  const b = new THREE.Mesh(sg, bodyMat), o = new THREE.Mesh(sg, OUT); o.scale.setScalar(1.1); body.add(o, b); body.position.y = r;
  const wings = [];
  for (const s of [-1,1]) { const pv = new THREE.Group(); pv.position.set(s*r*.86, 0, 0);
    const w = new THREE.Mesh(new THREE.BoxGeometry(r*.18, r*.5, r*.8), toon(0xffb21f)); w.position.x = s*r*.1;
    const wo = new THREE.Mesh(w.geometry, OUT); wo.scale.setScalar(1.25); w.add(wo); pv.add(w); body.add(pv); wings.push(pv); }
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(r*.16, r*.45, 4), toon(0xffb21f)); tuft.position.set(0, r*1.05, 0); tuft.rotation.z = .3; body.add(tuft);
  const face = new THREE.Sprite(new THREE.SpriteMaterial({ map:faceTex, transparent:true })); face.scale.set(1.25, 1.25, 1); face.position.set(0, r*.15, r*.75); face.renderOrder = 2; body.add(face);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(r, 10), new THREE.MeshBasicMaterial({ color:0, transparent:true, opacity:.35, depthWrite:false })); shadow.rotation.x = -Math.PI/2; shadow.position.y = .02; root.add(shadow);
  const shield = new THREE.Mesh(new THREE.SphereGeometry(r*1.5, 8, 6), new THREE.MeshBasicMaterial({ color:0x53e3b7, wireframe:true, transparent:true, opacity:.75 })); shield.position.y = r; shield.visible = false; root.add(shield);
  scene.add(root);
  return { root, body, bodyMat, wings, shadow, shield, face };
}
const ch = { x:0, z:2, y:0, vx:0, vz:0, vy:0, air:false, hopCd:0, inv:0, shield:0, knock:0, sq:0, sqv:0, mesh:buildChick() };

/* ---------------- hawks ---------------- */
function buildHawk(){
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const r = .75, sg = new THREE.SphereGeometry(r, 10, 7);
  body.add(new THREE.Mesh(sg, toon(0x8e5530))); const o = new THREE.Mesh(sg, OUT); o.scale.setScalar(1.1); body.add(o);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(r*.8, 10, 6, 0, Math.PI*2, 0, Math.PI*.45), toon(0xfff2cf)); cap.position.set(0, r*.3, r*.2); body.add(cap);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(r*.24, r*.6, 4), toon(0xffc23d)); beak.rotation.x = Math.PI/2; beak.position.set(0, 0, r*1.05); body.add(beak);
  for (const s of [-1,1]) { const brow = new THREE.Mesh(new THREE.BoxGeometry(r*.4, r*.1, r*.1), toon(0x0b0817)); brow.position.set(s*r*.34, r*.5, r*.88); brow.rotation.z = s*.45; body.add(brow); }
  const wings = [];
  for (const s of [-1,1]) { const pv = new THREE.Group(); pv.position.set(s*r*.8, r*.1, 0);
    const w = new THREE.Mesh(new THREE.BoxGeometry(r*1.9, r*.14, r*.9), toon(0x5b3420)); w.position.x = s*r*.95;
    const wo = new THREE.Mesh(w.geometry, OUT); wo.scale.set(1.06, 1.6, 1.15); w.add(wo); pv.add(w); body.add(pv); wings.push(pv); }
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(.9, 10), new THREE.MeshBasicMaterial({ color:0, transparent:true, opacity:.35, depthWrite:false })); shadow.rotation.x = -Math.PI/2; shadow.position.y = .03;
  const ret = new THREE.Group();
  const rr = new THREE.Mesh(new THREE.RingGeometry(1.15, 1.4, 20), new THREE.MeshBasicMaterial({ color:0xff5a3c, transparent:true, depthWrite:false, side:THREE.DoubleSide }));
  const rd = new THREE.Mesh(new THREE.CircleGeometry(1.15, 20), new THREE.MeshBasicMaterial({ color:0xff5a3c, transparent:true, opacity:.18, depthWrite:false }));
  rr.rotation.x = rd.rotation.x = -Math.PI/2; rr.position.y = .05; rd.position.y = .04; ret.add(rr, rd); ret.visible = false;
  const wave = new THREE.Mesh(new THREE.RingGeometry(.85, 1, 24), new THREE.MeshBasicMaterial({ color:0xfff2cf, transparent:true, depthWrite:false, side:THREE.DoubleSide }));
  wave.rotation.x = -Math.PI/2; wave.position.y = .06; wave.visible = false;
  scene.add(root, shadow, ret, wave);
  return { root, body, wings, shadow, ret, rr, wave };
}
const hawks = [0,1,2].map(i => ({ i, active:false, state:'circle', t:0, ang:i*2.1, x:0, y:6.5, z:0, tx:0, tz:0, sx:0, sz:0, sy:6.5, waveT:-1, mesh:buildHawk() }));

/* ---------------- pickups ---------------- */
const eggGeo = new THREE.SphereGeometry(.38, 8, 6);
const eggs = [0,1,2].map(() => { const m = new THREE.Mesh(eggGeo, toon(0xffe27a, { emissive:0xffb21f, emissiveIntensity:.25 })); m.scale.y = 1.3; const o = new THREE.Mesh(eggGeo, OUT); o.scale.setScalar(1.15); m.add(o); scene.add(m); return { m, alive:false, t:rnd(.2,1.2), x:0, z:0 }; });
const ringM = (() => { const t = new THREE.Mesh(new THREE.TorusGeometry(.75, .16, 6, 14), toon(0x53e3b7, { emissive:0x53e3b7, emissiveIntensity:.4 })); const o = new THREE.Mesh(t.geometry, OUT); o.scale.setScalar(1.1); t.add(o); scene.add(t); return t; })();
const ring = { alive:false, t:5, x:0, z:0 };
function freeSpot(minChick=2.5){
  for (let k=0;k<40;k++) {
    const x = rnd(-HW+1, HW-1), z = rnd(-HL+1, HL-1);
    if (BUMPERS.some(b => len(b.x-x, b.z-z) < 1.8)) continue;
    if (len(ch.x-x, ch.z-z) < minChick) continue;

function targetPos(){

function stepChick(dt){
  ch.hopCd = Math.max(0, ch.hopCd-dt); ch.inv = Math.max(0, ch.inv-dt); ch.shield = Math.max(0, ch.shield-dt); ch.knock = Math.max(0, ch.knock-dt);

      const vn = ch.vx*nx + ch.vz*nz; if (vn < 0) { ch.vx -= 2*vn*nx; ch.vz -= 2*vn*nz; }
      ch.vx += nx*11; ch.vz += nz*11; ch.knock = .28; ch.sq = .45; b.flash = 1;
      burst(b.x+nx*b.r, .7, b.z+nz*b.r, 8, [0xfff2cf, BCOL[b.i]], 5, .4); SFX.bump(); shake = Math.max(shake, .15);

    }

    ctx.imageSmoothingEnabled = false; ctx.drawImage(prevC, x, y, w, h);
    const sx = x + (1 - (face.nx - (video.videoWidth - sw)/2/video.videoWidth)/(sw/video.videoWidth))*w, sy = y + face.ny*h;
    ctx.fillStyle = face.ok ? '#53e3b7' : '#ff5a3c'; ctx.fillRect(sx-3, sy-3, 6, 6);
    // mouth meter
    ctx.fillStyle = '#0b0817'; ctx.fillRect(x, y+h+8, w, 14);
    ctx.fillStyle = face.jaw > .42 ? '#ff8fb3' : '#9a8fc4'; ctx.fillRect(x+2, y+h+10, (w-4)*clamp(face.jaw/.6, 0, 1), 10);
    ctx.fillStyle = '#fff2cf'; ctx.fillRect(x + 2 + (w-4)*.7, y+h+8, 2, 14);
    text('张嘴', x + w/2, y+h+34, 16, '#9a8fc4', 'center', 4);
  } else {
    text(face.on ? '摄像头加载中' : '鼠标模式', x+w/2, y+h/2-10, 15, '#9a8fc4', 'center', 4);
    if (!face.on) text('点击 = 跳', x+w/2, y+h/2+14, 15, '#9a8fc4', 'center', 4);
  }
}

function drawHUD(rdt){
  // danger vignette
  if (danger > 0) {
    const g = ctx.createRadialGradient(OW/2, OH/2, OH*.25, OW/2, OH/2, OH*.62);
    g.addColorStop(0, 'rgba(255,60,40,0)'); g.addColorStop(1, `rgba(255,60,40,${.5*danger})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,OW,OH);
  }
  if (redFlash > 0) { ctx.fillStyle = `rgba(255,90,60,${redFlash*.45})`; ctx.fillRect(0,0,OW,OH); }

  const playing = G.phase === 'play' || G.phase === 'count' || G.phase === 'calib' || G.phase === 'end';
  if (playing) {
    drawPreview();
    // timer
    const left = Math.max(0, GAME.dur - G.elapsed), s = Math.ceil(left);
    box(OW/2-62, 18, 124, 52);
    const tsc = left < 5 && G.phase === 'play' ? 1 + (1 - (left % 1))*.18 : 1;
    ctx.save(); ctx.translate(OW/2, 46); ctx.scale(tsc, tsc); text(`0:${String(s).padStart(2,'0')}`, 0, 0, 34, left < 5 ? '#ff5a3c' : '#fff2cf'); ctx.restore();
    // score
    box(OW-140, 18, 124, 52);
    text(String(G.score), OW-30, 46, 30, '#ffd23f', 'right');
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(OW-128, 36, 14, 18); ctx.fillStyle = '#0b0817'; ctx.fillRect(OW-128, 36, 14, 2);
    // hearts
    for (let i=0;i<GAME.hearts;i++) heart(OW/2-50 + i*36, 84, i < G.hearts, 4);
    if (ch.shield > 0) text(`护盾 ${Math.ceil(ch.shield)}`, OW/2, 126, 18, '#53e3b7', 'center', 4);
  }

  // popups
  for (let i=popups.length-1;i>=0;i--) {
    const p = popups[i]; p.t += rdt;
    if (p.t > 1) { popups.splice(i,1); continue; }
    const [sx, sy] = project(p.x, p.y, p.z);
    const sc = p.t < .15 ? easeOutBack(p.t/.15) : 1;
    ctx.save(); ctx.globalAlpha = p.t > .7 ? 1 - (p.t-.7)/.3 : 1; ctx.translate(sx, sy - easeOutCubic(p.t)*MOTION.popupRise); ctx.scale(sc, sc);
    text(p.text, 0, 0, 24, p.color); ctx.restore();
  }
  // callout
  for (let i=callouts.length-1;i>=0;i--) {
    const c = callouts[i]; c.t += rdt;
    const total = MOTION.calloutIn + MOTION.calloutHold + .2;
    if (c.t > total) { callouts.splice(i,1); continue; }
    const sc = c.t < MOTION.calloutIn ? easeOutBack(c.t/MOTION.calloutIn)*1 : 1;
    ctx.save(); ctx.globalAlpha = c.t > total-.2 ? (total-c.t)/.2 : 1; ctx.translate(OW/2, OH*.36); ctx.scale(sc, sc); ctx.rotate(-.04);
    text(c.text, 0, 0, 64, c.color, 'center', 12); ctx.restore();
  }

  if (G.phase === 'calib') {
    const [cx, cy] = [OW/2, OH*.42];
    box(40, cy-80, OW-80, 160);
    if (face.on) {
      text(face.ok ? '保持不动…' : '把脸放进摄像头画面里', cx, cy-30, 30, '#fff2cf');
      text('正对屏幕，脑袋放在舒服的位置', cx, cy+16, 20, '#9a8fc4', 'center', 4);
      ctx.fillStyle = '#0b0817'; ctx.fillRect(cx-120, cy+44, 240, 14);
      ctx.fillStyle = '#53e3b7'; ctx.fillRect(cx-118, cy+46, 236*clamp(G.calibT/.9, 0, 1), 10);
    } else {
      text('鼠标移到哪，小鸡跑到哪', cx, cy-24, 28, '#fff2cf');
      text('点击跳起来躲老鹰', cx, cy+22, 24, '#9a8fc4', 'center', 4);
    }
  }
  if (G.phase === 'count') {
    const n = Math.ceil(G.countT), f = 1 - (G.countT % 1);
    const sc = easeOutBack(Math.min(1, f/.25));
    ctx.save(); ctx.translate(OW/2, OH*.42); ctx.scale(sc*1.2, sc*1.2); text(n > 0 ? String(n) : '跑！', 0, 0, 96, '#ffd23f', 'center', 14); ctx.restore();
    text('转头移动 · 张嘴跳', OW/2, OH*.56, 26, '#fff2cf');
  }
  if (G.phase === 'play' && G.elapsed < 4) {
    ctx.globalAlpha = G.elapsed > 3.4 ? (4 - G.elapsed)/.6 : 1;
    box(30, OH-110, OW-60, 64, '#0b0817');
    text(face.on ? '红圈 = 老鹰要俯冲 · 张嘴跳起来躲' : '红圈 = 老鹰要俯冲 · 点击跳起来躲', OW/2, OH-80, 22, '#fff2cf', 'center', 4);
    ctx.globalAlpha = 1;
  }
  if (G.phase === 'end' && G.endT > .7) drawCard(G.endT - .7);
  if (timeScale !== 1) text('慢放 ×0.25', OW/2, OH-24, 18, '#53e3b7', 'center', 4);
}

const RANKS = [[0,'被叼走的小鸡'],[60,'灵活小鸡'],[130,'铁头小鸡'],[220,'鸡中之王']];
function drawCard(t){
  const p = clamp(t/MOTION.cardIn, 0, 1);
  const y0 = (1 - easeOutBack(p))*OH*.7;
  ctx.fillStyle = `rgba(17,12,34,${.65*p})`; ctx.fillRect(0,0,OW,OH);
  const w = 440, h = 560, x = (OW-w)/2, y = 120 + y0;
  box(x, y, w, h, '#2b2250');
  ctx.fillStyle = '#382d66'; ctx.fillRect(x+10, y+10, w-20, h-20);
  const rank = RANKS.filter(r => G.final >= r[0]).pop()[1];
  text(G.won ? '活下来了！' : '被叼走了…', OW/2, y+50, 26, G.won ? '#53e3b7' : '#ff5a3c', 'center', 6);
  text(rank, OW/2, y+96, 44, '#ffd23f', 'center', 10);
  // funniest face
  const fs = 168, fx = OW/2 - fs/2, fy = y+132;
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(OW/2, fy+fs/2, fs/2+10, 0, 7); ctx.fill();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(snapC, fx, fy, fs, fs);
  if (G.final >= 130) { ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#0b0817'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(OW/2-46, fy-6); ctx.lineTo(OW/2-46, fy-40); ctx.lineTo(OW/2-22, fy-22); ctx.lineTo(OW/2, fy-46); ctx.lineTo(OW/2+22, fy-22); ctx.lineTo(OW/2+46, fy-40); ctx.lineTo(OW/2+46, fy-6); ctx.closePath(); ctx.stroke(); ctx.fill(); }
  if (face.on) text('你张嘴最大的一瞬间', OW/2, fy+fs+28, 16, '#9a8fc4', 'center', 4);
  const sp = clamp((t - .35)/MOTION.scoreCount, 0, 1);
  text(String(Math.round(G.final*easeOutCubic(sp))), OW/2, y+376, 64, '#fff2cf', 'center', 10);
  text(`金蛋 ${G.eggs}   闪避 ${G.dodges}   生命 +${G.bonus}`, OW/2, y+430, 20, '#9a8fc4', 'center', 4);
  ctx.fillStyle = '#0b0817'; ctx.fillRect(x+30, y+464, w-60, 60);
  text('@你的朋友 来挑战我的分数', OW/2, y+494, 22, '#ffd23f', 'center', 4);
  text('BOUNCE FLOCK · 弹弹追鸡', OW/2, y+h+30, 16, '#9a8fc4', 'center', 4);
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (now-last)/1000); last = now;
  pollFace(now);
  if (face.on && face.ok && face.jaw > .42 && face.armed) { face.armed = false; hopReq = true; }
  if (face.jaw < .22) face.armed = true;
  const dt = rdt * timeScale * (slow > 0 ? MOTION.slowScale : 1);
  slow = Math.max(0, slow - rdt*timeScale);

  if (G.phase === 'menu') {
    G.elapsed += dt;
    const t = G.elapsed; pointerT = [Math.sin(t*.7)*3, 1.5 + Math.sin(t*.5)*3]; if (!face.on) hopReq = Math.random() < .006;
    hawks[0].active = true; stepChick(dt); stepHawk(hawks[0], dt);
    if (hawks[0].state === 'circle' && hawks[0].t <= 0) hawks[0].t = 2;
  } else if (G.phase === 'calib') {
    stepChick(dt);
    if (!face.on) { G.calibT += rdt; if (G.calibT > 1.6) { G.phase = 'count'; G.countT = 3; startRec(); } }
    else if (face.ok) { G.calibT += rdt; if (G.calibT > .9) { face.cx = face.nx; face.cy = face.ny; G.phase = 'count'; G.countT = 3; startRec(); } }
    else G.calibT = 0;
  } else if (G.phase === 'count') {
    const before = Math.ceil(G.countT); G.countT -= rdt; const after = Math.ceil(G.countT);
    if (after !== before) after > 0 ? SFX.count() : SFX.go();
    stepChick(dt);
    if (G.countT <= -.35) { G.phase = 'play'; G.elapsed = 0; }
  } else if (G.phase === 'play') {
    G.elapsed += dt;
    GAME.hawkAt.forEach((at, i) => { if (G.elapsed >= at && !hawks[i].active) { hawks[i].active = true; hawks[i].state = 'circle'; hawks[i].t = 1.2; if (i) callout(`老鹰 +1`, '#ff5a3c'); } });
    stepChick(dt); hawks.forEach(h => stepHawk(h, dt)); stepPickups(dt);
    if (G.elapsed >= GAME.dur) endRound(true);
  } else if (G.phase === 'end') {
    G.endT += rdt; stepChick(dt); hawks.forEach(h => stepHawk(h, dt));
    if (G.endT > 1.6 && $('#endOv').hidden) { $('#endOv').hidden = false; $('#help').hidden = true; }
    if (G.endT > 3.2) stopRec();
  }

  // danger cue: any hawk aiming near the chick
  const aiming = G.phase === 'play' && hawks.some(h => h.active && h.state === 'aim' && len(h.tx-ch.x, h.tz-ch.z) < 2.2);
  danger = lerp(danger, aiming ? .6 + Math.sin(now/90)*.4 : 0, Math.min(1, rdt*10));
  if (aiming && now - lastBeat > 280) { lastBeat = now; SFX.beat(); }
  redFlash = Math.max(0, redFlash - rdt*2.2);
  for (const b of BUMPERS) b.flash = Math.max(0, b.flash - rdt*4);

  // ---- visuals ----
  const t = now/1000;
  const cm = ch.mesh;
  cm.root.position.set(ch.x, 0, ch.z);
  const airS = ch.air ? clamp(ch.vy/MOTION.hopVelocity, -1, 1)*-.18 : 0;
  const s = ch.sq + airS;
  cm.body.scale.set(1+s*.35, 1-s*.45, 1+s*.35);
  cm.body.position.y = .8*(1-s*.45) + ch.y;
  cm.body.rotation.y = clamp(ch.vx*.05, -.5, .5);
  cm.body.rotation.z = -clamp(ch.vx*.03, -.3, .3);
  const flap = ch.air ? .9 + Math.sin(t*30)*.4 : (len(ch.vx,ch.vz) > 3 ? Math.abs(Math.sin(t*16))*.6 : .08);
  cm.wings.forEach((w,i) => w.rotation.z = (i ? 1 : -1)*flap);
  cm.shadow.scale.setScalar(Math.max(.4, 1 - ch.y*.12));
  cm.shield.visible = ch.shield > 0; cm.shield.rotation.y = t*2;
  cm.root.visible = !(ch.inv > 0 && Math.floor(t*14) % 2 === 0);
  for (const h of hawks) {
    const m = h.mesh, vis = h.active;
    m.root.visible = m.shadow.visible = vis;
    m.ret.visible = vis && h.state === 'aim';
    if (!vis) { m.wave.visible = false; continue; }
    m.root.position.set(h.x, h.y, h.z);
    const dir = h.state === 'circle' ? h.ang + Math.PI : Math.atan2(h.tx - h.x, h.tz - h.z);
    m.body.rotation.y = h.state === 'circle' ? -h.ang : (h.state === 'aim' || h.state === 'dive' ? Math.atan2(ch.x-h.x, ch.z-h.z) : m.body.rotation.y);
    m.body.rotation.x = h.state === 'dive' ? .9 : h.state === 'aim' ? -.25 : 0;
    const wf = h.state === 'dive' ? -1.1 : h.state === 'aim' ? Math.sin(t*22)*.5 : Math.sin(t*8 + h.i)*.45;
    m.wings.forEach((w,i) => w.rotation.z = (i ? 1 : -1)*wf);
    m.shadow.position.set(h.x, .03, h.z); m.shadow.scale.setScalar(clamp(1.6 - h.y*.15, .5, 1.6)); m.shadow.material.opacity = clamp(.55 - h.y*.04, .15, .5);
    if (h.state === 'aim') {
      const p = 1 - h.t/MOTION.aimTime;
      m.ret.position.set(h.tx, 0, h.tz); m.ret.scale.setScalar(lerp(1.7, 1, easeOutCubic(p)));
      m.rr.material.opacity = Math.floor(t*(6 + p*14)) % 2 ? 1 : .35;
    }
    if (h.waveT >= 0 && h.waveT < .4) {
      const p = h.waveT/.4; m.wave.visible = true; m.wave.position.set(h.tx, .06, h.tz); m.wave.scale.setScalar(.6 + easeOutCubic(p)*3); m.wave.material.opacity = 1-p;
    } else m.wave.visible = false;
  }
  eggs.forEach((e,i) => { e.m.visible = e.alive; if (e.alive) { const pop = easeOutBack(Math.min(1, (e.born||0)/.3)); e.m.position.set(e.x, .55 + Math.sin(t*3+i)*.12, e.z); e.m.scale.set(pop, 1.3*pop, pop); e.m.rotation.y = t*1.5; } });
  ringM.visible = ring.alive; if (ring.alive) { ringM.position.set(ring.x, 1 + Math.sin(t*3)*.15, ring.z); ringM.rotation.set(Math.PI/2, 0, t*2); }
  bumperMeshes.forEach((m,i) => { const f = BUMPERS[i].flash; m.cap.scale.set(1+f*.2, 1-f*.18, 1+f*.2); m.capMat.emissiveIntensity = f; });
  stepParts(dt);

  // camera: gentle follow + shake + punch-in
  shake = Math.max(0, shake - rdt*1.8); punch = Math.max(0, punch - rdt*2.5);
  camera.fov = 55 - easeOutCubic(punch)*MOTION.punchFov; camera.updateProjectionMatrix();
  camera.position.set(CAM_BASE.x + ch.x*.22 + (Math.random()-.5)*shake, CAM_BASE.y + (Math.random()-.5)*shake, CAM_BASE.z + ch.z*.1);
  camera.lookAt(ch.x*.22, 0, -.6 + ch.z*.1);

  renderer.render(scene, camera);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(glc, 0, 0, OW, OH);
  drawHUD(rdt);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
