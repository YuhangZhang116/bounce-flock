<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>弹弹追鸡 · 联机特效版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1430; --line:#0b0817; --panel:#2b2250; --panel2:#382d66;
  --cream:#fff2cf; --dim:#9a8fc4; --yolk:#ffd23f; --hawk:#ff5a3c; --mint:#53e3b7; --pink:#ff8fb3; --muscle:#ff8a3c;
  --f:"DotGothic16","Silkscreen","PingFang SC","Microsoft YaHei",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#0f0b1f;color:var(--cream);font-family:var(--f);overscroll-behavior:none}
body{display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#frame{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);container-type:size;background:var(--ink);box-shadow:0 0 0 4px var(--line)}
#out{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}
#joy{position:absolute;width:26cqw;height:26cqw;margin:-13cqw 0 0 -13cqw;border:.8cqw solid rgba(255,242,207,.55);background:rgba(11,8,23,.35);border-radius:50%;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:11cqw;height:11cqw;margin:-5.5cqw 0 0 -5.5cqw;background:var(--yolk);border:.8cqw solid var(--line);border-radius:50%}
#jumpBtn{position:absolute;right:max(4cqw,env(safe-area-inset-right,0px));bottom:calc(9cqh + env(safe-area-inset-bottom,0px));width:24cqw;height:24cqw;border-radius:50%;padding:0;font-size:7cqw;background:var(--yolk);color:var(--line);touch-action:none}
#jumpBtn.hawk{background:var(--hawk)}
.ov{touch-action:pan-y;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:2.4cqh;padding:6cqw;box-sizing:border-box;background:rgba(17,12,34,.78);overflow:auto}
.ov.end{background:transparent;justify-content:flex-end;padding-bottom:4cqh;gap:1.6cqh}
h1{margin:0;font-weight:400;font-size:13cqw;line-height:1.05;color:var(--yolk);text-shadow:0 .9cqw 0 var(--line),.7cqw 0 0 var(--hawk)}
.sub{font-family:"Silkscreen",monospace;color:var(--mint);font-size:3cqw;letter-spacing:.2em;margin-top:1cqh}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.2cqh}
ol li{display:flex;gap:3cqw;align-items:center;font-size:3.7cqw;line-height:1.35;background:var(--line);padding:1.8cqw 3cqw}
ol b{flex:0 0 auto;width:7cqw;height:7cqw;display:grid;place-items:center;background:var(--c);color:var(--line);font-weight:400}
button{font:inherit;cursor:pointer;color:var(--cream);background:var(--panel2);border:.8cqw solid var(--line);box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.28),0 .8cqw 0 var(--line);padding:2.4cqw 3cqw;font-size:4.4cqw}
button:active{transform:translateY(.8cqw);box-shadow:inset 0 -.5cqw 0 rgba(0,0,0,.28)}
button:focus-visible,input:focus-visible{outline:.8cqw solid var(--yolk);outline-offset:.6cqw}
button.big{background:var(--yolk);color:var(--line);font-size:5.6cqw}
button[disabled]{opacity:.5;cursor:wait}
input.tx{font:inherit;font-size:4.6cqw;background:var(--line);color:var(--cream);border:.8cqw solid var(--panel2);padding:2cqw 2.6cqw;min-width:0;box-sizing:border-box;width:100%}
.row{display:flex;gap:3cqw;align-items:stretch}.row>*{flex:1;min-width:0}
.row>.narrow{flex:0 0 auto}
label.ck{display:flex;align-items:center;gap:2cqw;font-size:3.7cqw}
label.ck input{width:5cqw;height:5cqw;accent-color:var(--hawk)}
.note{font-size:3.1cqw;color:var(--dim);line-height:1.5;margin:0}
.err{color:var(--hawk)}
.lbl{font-size:3.4cqw;color:var(--dim)}
#codeBig{font-family:"Silkscreen",monospace;font-size:15cqw;letter-spacing:.18em;text-align:center;color:var(--yolk);background:var(--line);padding:1cqh 0}
#plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1cqh}
#plist li{display:flex;align-items:center;gap:3cqw;background:var(--line);padding:1.6cqw 2.6cqw;font-size:4.2cqw}
#plist img,#plist i{width:9cqw;height:9cqw;image-rendering:pixelated;background:var(--yolk);border-radius:50%;flex:0 0 auto}
#plist em{margin-left:auto;font-style:normal;font-size:3.2cqw;color:var(--mint)}
#recBadge{position:absolute;bottom:4.5cqh;right:3cqw;font-family:"Silkscreen",monospace;font-size:3.2cqw;background:var(--hawk);color:var(--line);padding:.6cqw 1.6cqw;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#help{position:absolute;bottom:1.2cqh;left:0;right:0;text-align:center;font-size:2.8cqw;color:var(--dim);pointer-events:none}
#netTag{position:absolute;top:1cqh;left:50%;transform:translateX(-50%);font-size:2.8cqw;color:var(--mint);pointer-events:none}
@media (prefers-reduced-motion:reduce){#recBadge{animation:none}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="out" aria-label="游戏画面"></canvas>

  <div class="ov" id="menu">
    <div><h1>弹弹追鸡</h1><div class="sub">FACE PVP · 2–5 PLAYERS</div></div>
    <ol>
      <li><b style="--c:var(--yolk)">1</b>每人用自己的摄像头，转动脑袋移动</li>
      <li><b style="--c:var(--hawk)">2</b>一人当老鹰：张嘴锁定，红圈落下就俯冲抓人</li>
      <li><b style="--c:var(--muscle)">3</b>其他人当小鸡：张嘴跳起来躲，抢「?」盒子变身肌肉男小鸡</li>
    </ol>
    <input class="tx" id="nick" maxlength="8" placeholder="你的名字" autocomplete="off">
    <button class="big" id="createBtn" type="button">创建房间</button>
    <div class="row">
      <input class="tx" id="codeIn" maxlength="4" placeholder="房间号" autocomplete="off" style="text-transform:uppercase">
      <button class="narrow" id="joinBtn" type="button">加入</button>
    </div>
    <button id="soloBtn" type="button">单人练习（电脑当老鹰）</button>
    <div class="row">
      <label class="ck"><input type="checkbox" id="camChk" checked>用摄像头</label>
      <label class="ck"><input type="checkbox" id="recChk" checked>录下每一局</label>
    </div>
    <p class="note" id="note">人脸只在你自己的设备上识别，只会把你 24×24 的像素头像发给同房间的人。不开摄像头也能玩：手指拖动移动，右下按钮跳。</p>
  </div>

  <div class="ov" id="lobby" hidden>
    <div class="lbl">房间号 · 发给朋友</div>
    <div id="codeBig">----</div>
    <button id="copyBtn" type="button">复制房间号</button>
    <ul id="plist"></ul>
    <button class="big" id="startBtn" type="button">开始这一局</button>
    <p class="note" id="waitTxt">等房主开局…</p>
    <p class="note">空位由电脑小鸡补齐。老鹰每局轮换。</p>
    <button id="leaveBtn" type="button">离开房间</button>
  </div>

  <div class="ov end" id="endOv" hidden>
    <div class="row">
      <button class="big" id="againBtn" type="button">再来一局</button>
      <button id="saveBtn" type="button" hidden>保存视频</button>
    </div>
    <p class="note" id="endWait" style="text-align:center" hidden>等房主开下一局…</p>
    <button id="homeBtn" type="button">离开</button>
  </div>

  <div id="joy" hidden><i></i></div>
  <button id="jumpBtn" type="button" hidden>跳</button>
  <div id="recBadge" hidden>● REC</div>
  <div id="help" hidden data-desk>M 慢放 · C 重新校准 · 空格也能张嘴</div>
  <div id="netTag" hidden></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const PEERJS = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
const LOCAL = new URLSearchParams(location.search).has('local'); // 本机多标签测试（BroadcastChannel）

/* =====================================================================
   动效规范 MOTION SPEC
   ===================================================================== */
const MOTION = {
  hopVelocity:9.5, gravity:30, takeoffStretch:-.55, landSquash:.55, squashSpring:190, squashDamp:11,
  hawkHeight:6, hawkFly:13.5, hawkRetSpeed:3.2,
  hawkAim:.62, hawkAimQuick:.3, hawkDive:.24, hawkRise:.55, hawkCd:.75,
  hitRadius:1.3, clawMul:1.7, nearRadius:2.3,
  hitSlowmo:.3, slowScale:.25, hitShake:.8, impactShake:.28, punchFov:7,
  punchStun:1.6, fakeStun:.6,
  calloutIn:.18, calloutHold:.6, popupRise:70, cardIn:.6, scoreCount:.9,
  muscleScale:1.55, flexEvery:1.1,
};
const GAME = { dur:50, hearts:2, minChicks:3, eggPts:10, dodgePts:5, catchPts:30, hitPts:10, punchPts:15, hawkBuffEvery:12, itemEvery:4, maxItems:3, eggs:5 };
const BUFFS = {
  muscle:{ name:'肌肉男小鸡', dur:6, color:'#ff8a3c', w:.34 },
  speed: { name:'闪电小鸡',   dur:6, color:'#ffd23f', w:.26 },
  decoy: { name:'分身术',     dur:6, color:'#ff8fb3', w:.2 },
  ghost: { name:'隐身',       dur:5, color:'#9be7ff', w:.2 },
};
const BUFF_KEYS = Object.keys(BUFFS);
const HAWK_BUFFS = { claw:{ name:'巨爪', color:'#ff5a3c' }, quick:{ name:'闪电俯冲', color:'#ffd23f' } };
const HB_KEYS = Object.keys(HAWK_BUFFS);

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rnd = (a,b) => a + Math.random()*(b-a);
const len = (x,z) => Math.hypot(x,z);
const r2 = v => Math.round(v*100)/100;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const easeInCubic = t => t*t*t;
const easeOutCubic = t => 1 - Math.pow(1-t, 3);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let store = {}; try { store = JSON.parse(localStorage.getItem('bflock') || '{}'); } catch {}
const save = () => { try { localStorage.setItem('bflock', JSON.stringify(store)); } catch {} };

/* ---------------- output canvas ---------------- */
// 手机全面屏：按屏幕比例拉长画面（9:16 到 9:20），电脑固定 9:16
const ASPECT = matchMedia('(pointer:coarse)').matches ? clamp(innerHeight/innerWidth, 16/9, 20/9) : 16/9;
const OW = 540, OH = Math.round(OW*ASPECT/3)*3, SC = 3, LW = OW/SC, LH = OH/SC;
const out = $('#out'); out.width = OW; out.height = OH;
{ const fr = $('#frame'); fr.style.width = `min(100vw, calc(100dvh / ${ASPECT}))`; fr.style.height = `min(100dvh, calc(100vw * ${ASPECT}))`; }
const ctx = out.getContext('2d');

/* ---------------- three.js ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(1); renderer.setSize(LW, LH, false);
const glc = renderer.domElement;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x140f26);
const camera = new THREE.PerspectiveCamera(55, LW/LH, .1, 100);
const HW = 8, HL = 12;
const GRAD = (() => { const t = new THREE.DataTexture(new Uint8Array([70,150,255]), 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (c, x={}) => new THREE.MeshToonMaterial({ color:c, gradientMap:GRAD, ...x });
const OUT = new THREE.MeshBasicMaterial({ color:0x0b0817, side:THREE.BackSide });
scene.add(new THREE.HemisphereLight(0xc9c0ff, 0x2a1d4a, .95));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.6); sun.position.set(-6, 18, 9); scene.add(sun);
function ctex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; }

const floorTex = ctex(HW*8, HL*8, (g,w,h) => {
  for (let y=0;y<h;y+=4) for (let x=0;x<w;x+=4) { g.fillStyle = ((x+y)/4)%2 ? '#2e2560' : '#352a6e'; g.fillRect(x,y,4,4); }
  g.strokeStyle = '#53e3b7'; g.strokeRect(2.5,2.5,w-5,h-5);
  g.fillStyle = 'rgba(255,210,63,.18)'; g.fillRect(w/2-8, h/2-8, 16, 16);
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HW*2, HL*2), toon(0xffffff, { map:floorTex })); floor.rotation.x = -Math.PI/2; scene.add(floor);
const under = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshBasicMaterial({ color:0x0f0b1f })); under.rotation.x = -Math.PI/2; under.position.y = -.02; scene.add(under);
const brick = ctex(16, 8, g => { g.fillStyle='#ff8fb3'; g.fillRect(0,0,16,8); g.fillStyle='#d9628f'; g.fillRect(0,3,16,1); g.fillRect(0,7,16,1); g.fillRect(7,0,1,3); g.fillRect(3,4,1,3); g.fillRect(11,4,1,3); });
function wall(w, d, x, z){ const t = brick.clone(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.max(w,d)/1.4, 1); t.needsUpdate = true;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.2, d), toon(0xffffff, { map:t })); m.position.set(x, .6, z); scene.add(m); }
wall(HW*2+2, 1, 0, -HL-.5); wall(HW*2+2, 1, 0, HL+.5); wall(1, HL*2, -HW-.5, 0); wall(1, HL*2, HW+.5, 0);

const BUMPERS = [[-3.6,-6],[3.6,-6],[0,-2.2],[-4.4,2],[4.4,2],[0,5.8],[-5.2,8.6],[5.2,8.6],[-5.4,-9.2],[5.4,-9.2]].map(([x,z],i) => ({ x, z, r:.85, flash:0, i }));
const BCOL = [0xff8fb3, 0x53e3b7, 0xffd23f, 0x53e3b7, 0xff8fb3, 0xffd23f, 0xff8fb3, 0x53e3b7, 0x53e3b7, 0xff8fb3];
const bumperMeshes = BUMPERS.map((b,i) => {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(b.r, b.r*1.08, .35, 10), toon(0x2b2250)); base.position.y = .17;
  const capMat = toon(BCOL[i], { emissive:BCOL[i], emissiveIntensity:0 });
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(b.r*.85, b.r*.85, .45, 10), capMat); cap.position.y = .55;
  const o = new THREE.Mesh(cap.geometry, OUT); o.scale.setScalar(1.1); cap.add(o);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(b.r*.4, b.r*.4, .16, 10), toon(0xfff2cf)); top.position.y = .85;
  g.add(base, cap, top); g.position.set(b.x, 0, b.z); scene.add(g);
  return { cap, capMat };
});

// particles
const PMAX = 300;
const pMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.16,.16,.16), new THREE.MeshBasicMaterial({ color:0xffffff }), PMAX);
pMesh.frustumCulled = false; scene.add(pMesh);
const parts = Array.from({length:PMAX}, () => ({ life:0 }));
for (let i=0;i<PMAX;i++) pMesh.setColorAt(i, new THREE.Color(1,1,1));
let pNext = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _c = new THREE.Color();
function burst(x, y, z, n, colors, spd=5, life=.6, grav=14, size=1){
  for (let k=0;k<n;k++) {
    const i = pNext, p = parts[i]; pNext = (pNext+1) % PMAX;
    const a = Math.random()*Math.PI*2, u = .4 + Math.random();
    Object.assign(p, { x, y, z, vx:Math.cos(a)*spd*u, vz:Math.sin(a)*spd*u, vy:rnd(.3,1)*spd, life:life*rnd(.6,1.2), g:grav, s:size*rnd(.7,1.3) });
    p.max = p.life;
    pMesh.setColorAt(i, _c.set(Array.isArray(colors) ? colors[k % colors.length] : colors));
  }
  pMesh.instanceColor.needsUpdate = true;
}
function stepParts(dt){
  for (let i=0;i<PMAX;i++) {
    const p = parts[i];
    if (p.life > 0) {
      p.life -= dt; p.vy -= p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      if (p.y < .08) { p.y = .08; p.vy *= -.4; p.vx *= .7; p.vz *= .7; }
      const s = p.s * Math.max(0, p.life/p.max);
      _m.compose(_p.set(p.x,p.y,p.z), _q, _s.set(s,s,s));
    } else _m.compose(_p.set(0,-50,0), _q, _s.set(0,0,0));
    pMesh.setMatrixAt(i, _m);
  }
  pMesh.instanceMatrix.needsUpdate = true;
}
// shockwave pool
const waves = [0,1,2,3].map(() => { const m = new THREE.Mesh(new THREE.RingGeometry(.85, 1, 24), new THREE.MeshBasicMaterial({ color:0xfff2cf, transparent:true, depthWrite:false, side:THREE.DoubleSide })); m.rotation.x = -Math.PI/2; m.visible = false; scene.add(m); return { m, t:-1, max:3.6 }; });
let waveNext = 0;
function wave(x, z, size=3.6, color=0xfff2cf){ const w = waves[waveNext]; waveNext = (waveNext+1)%waves.length; w.t = 0; w.max = size; w.m.material.color.set(color); w.m.position.set(x, .06, z); }

/* ---------------- faces (yours + everyone else's) ---------------- */
const FPX = 24;
function circleMaskAndQuantize(c){
  const g = c.getContext('2d', { willReadFrequently:true });
  const img = g.getImageData(0,0,FPX,FPX), d = img.data, ce = (FPX-1)/2;
  for (let y=0;y<FPX;y++) for (let x=0;x<FPX;x++) {
    const i = (y*FPX+x)*4, r = Math.hypot(x-ce, y-ce);
    if (r > ce+.4) { d[i+3] = 0; continue; }
    if (r > ce-.8) { d[i]=11; d[i+1]=8; d[i+2]=23; d[i+3]=255; continue; }
    for (let k=0;k<3;k++) { let v = d[i+k]/255; v = clamp((v-.5)*1.25+.54, 0, 1); d[i+k] = Math.round(v*5)/5*255; }
    d[i] = Math.min(255, d[i]+10); d[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
}
const CHICK_TINTS = ['#ffd23f','#ffe27a','#ffc93c','#fff08a','#ffb84a'];
function drawChickFace(c, tint='#ffd23f', mood=0){
  const g = c.getContext('2d'); g.clearRect(0,0,FPX,FPX);
  g.fillStyle = tint; g.beginPath(); g.arc(FPX/2, FPX/2, FPX/2, 0, 7); g.fill();
  g.fillStyle = '#0b0817'; g.fillRect(7,9,2,4); g.fillRect(15,9,2,4);
  if (mood) { g.fillRect(6,7,4,1); g.fillRect(14,7,4,1); }
  g.fillStyle = '#ff9a2e'; g.fillRect(10,14,4,2); g.fillRect(11,16,2,1);
  g.fillStyle = '#ff8fb3'; g.fillRect(4,14,3,2); g.fillRect(17,14,3,2);
  circleMaskAndQuantize(c);
}
const faces = new Map(); // key -> { c, tex, real }
function faceFor(key, tint){
  let f = faces.get(key);
  if (!f) {
    const c = document.createElement('canvas'); c.width = c.height = FPX; drawChickFace(c, tint || CHICK_TINTS[Math.abs(hashStr(key)) % CHICK_TINTS.length]);
    const tex = new THREE.CanvasTexture(c); tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
    f = { c, tex, real:false }; faces.set(key, f);
  }
  return f;
}
function hashStr(s){ let h = 0; for (const ch of String(s)) h = (h*31 + ch.charCodeAt(0))|0; return h; }
function setRemoteFace(pid, dataUrl){
  if (typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/')) return;
  const img = new Image();
  img.onload = () => { const f = faceFor(pid); const g = f.c.getContext('2d'); g.clearRect(0,0,FPX,FPX); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, FPX, FPX); f.tex.needsUpdate = true; f.real = true; f.url = dataUrl; renderLobby(); };
  img.src = dataUrl;

/* ---------------- main loop ---------------- */

function renderWorld(t, rdt){

        m.rr.material.opacity = Math.floor(t*(6 + v.aimP*14)) % 2 ? 1 : .35;
      }
      m.cross.visible = isMe && v.state === 'fly'; if (m.cross.visible) { m.cross.position.set(v.dx, .05, v.dz); m.cross.rotation.z = t; m.cross.material.color.set(v.cd <= 0 && !v.stun ? 0xff5a3c : 0x9a8fc4); }
